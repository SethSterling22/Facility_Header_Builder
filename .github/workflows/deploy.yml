name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub Container Registry. GHCR requires an all-lowercase path, which is
  # why the owner/repo isn't used verbatim.
  REGISTRY: ghcr.io
  IMAGE_NAME: sethsterling22/facility_header_builder
  CONTAINER_APP_NAME: facility-header-builder
  RESOURCE_GROUP: template-builder

permissions:
  contents: read
  # Push the image to GHCR with the built-in GITHUB_TOKEN.
  packages: write
  # Required for OIDC login to Azure — no long-lived credentials involved.
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (fails fast on type errors before touching Docker)
        run: npm run build

      - name: Verify the generated .dotx still meets the RamSoft rules
        run: npm run verify:dotx

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the new image to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
