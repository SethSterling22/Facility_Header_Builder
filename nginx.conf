server {
    # Must match EXPOSE in the Dockerfile and --target-port on the Container App.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
